<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Shop — Baking House</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="app-header"></div>
  <main id="main" class="container">
    <nav class="crumbs" aria-label="Breadcrumb"><ol id="crumbs"></ol></nav>
    <div class="shop-layout">
      <aside class="card filters" id="filters" aria-label="Filters">
        <div class="row" style="margin-bottom:12px"><h2 style="font-size:var(--bh-fs-lg);margin:0">Filter products</h2><span class="spacer"></span>
          <button class="icon-btn filter-toggle" id="filters-close" aria-label="Close filters"></button></div>
        <form id="filter-form">
          <fieldset><legend>Category</legend><div id="f-cat"></div></fieldset>
          <fieldset><legend>Price range (৳)</legend>
            <div class="range-row">
              <label class="sr-only" for="f-min">Minimum price</label><input class="input" id="f-min" name="min" inputmode="numeric" placeholder="0">
              <span>–</span>
              <label class="sr-only" for="f-max">Maximum price</label><input class="input" id="f-max" name="max" inputmode="numeric" placeholder="1,00,000">
            </div>
            <p class="hint">Weight items compare by per-kg price.</p>
          </fieldset>
          <fieldset><legend>Brand</legend><div id="f-brand"></div></fieldset>
          <fieldset><legend>Availability</legend>
            <label class="check"><input type="checkbox" name="instock" value="1"> In stock only</label>
            <label class="check"><input type="checkbox" name="weight" value="1"> Sold by weight (custom grams)</label>
          </fieldset>
          <button type="button" class="btn btn-outline btn-block" id="f-reset">Clear all filters</button>
        </form>
      </aside>

      <section aria-labelledby="shop-title">
        <div class="card toolbar">
          <button class="btn btn-outline btn-sm filter-toggle" id="filters-open" aria-controls="filters"></button>
          <h1 id="shop-title">All products</h1>
          <span class="muted small" id="count" aria-live="polite"></span>
          <span class="spacer"></span>
          <label class="small">Sort by
            <select class="input" id="sort" style="width:auto;min-height:36px;display:inline-block">
              <option value="popular">Popularity</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="name">Name A–Z</option>
            </select></label>
          <div class="row" style="gap:2px" role="group" aria-label="Layout">
            <button class="icon-btn" id="v-grid" aria-pressed="true" aria-label="Grid view"></button>
            <button class="icon-btn" id="v-list" aria-pressed="false" aria-label="List view"></button>
          </div>
        </div>
        <div class="active-filters" id="active"></div>
        <div id="results"><div class="grid grid-4" id="grid"></div></div>
      </section>
    </div>
  </main>
  <div class="drawer-overlay" id="f-overlay"></div>
  <div id="app-footer"></div>

  <script type="module">
    import { initShell, icon, productCard, CATEGORIES, PRODUCTS, esc, searchProducts, isInStock } from './assets/js/app.js';
    import { BRANDS } from './assets/js/data.js';

    const params = new URLSearchParams(location.search);
    initShell({ active: params.get('cat') ?? '' });

    document.getElementById('filters-open').innerHTML = `${icon('filter')} Filters`;
    document.getElementById('filters-close').innerHTML = icon('x');
    document.getElementById('v-grid').innerHTML = icon('grid');
    document.getElementById('v-list').innerHTML = icon('list');

    const form = document.getElementById('filter-form');
    const countBy = (fn) => (v) => PRODUCTS.filter((p) => fn(p) === v).length;
    document.getElementById('f-cat').innerHTML = CATEGORIES.filter((c) => c.slug !== 'combos').map((c) =>
      `<label class="check"><input type="checkbox" name="cat" value="${c.slug}"> ${esc(c.name)}<span class="count">${countBy((p) => p.category)(c.slug)}</span></label>`).join('');
    document.getElementById('f-brand').innerHTML = BRANDS.map((b) =>
      `<label class="check"><input type="checkbox" name="brand" value="${esc(b)}"> ${esc(b)}<span class="count">${countBy((p) => p.brand)(b)}</span></label>`).join('');

    // ---- State <-> URL (filters persist in the URL per blueprint §02) ----
    function readState() {
      const p = new URLSearchParams(location.search);
      return { q: p.get('q') ?? '', cat: p.getAll('cat'), brand: p.getAll('brand'), min: p.get('min') ?? '', max: p.get('max') ?? '',
        instock: p.get('instock') === '1', weight: p.get('weight') === '1', sort: p.get('sort') ?? 'popular', view: p.get('view') ?? 'grid' };
    }
    function writeState(s) {
      const p = new URLSearchParams();
      if (s.q) p.set('q', s.q);
      s.cat.forEach((c) => p.append('cat', c));
      s.brand.forEach((b) => p.append('brand', b));
      if (s.min) p.set('min', s.min);
      if (s.max) p.set('max', s.max);
      if (s.instock) p.set('instock', '1');
      if (s.weight) p.set('weight', '1');
      if (s.sort !== 'popular') p.set('sort', s.sort);
      if (s.view !== 'grid') p.set('view', s.view);
      history.replaceState(null, '', `${location.pathname}${p.toString() ? `?${p}` : ''}`);
    }
    function syncForm(s) {
      form.querySelectorAll('[name=cat]').forEach((i) => { i.checked = s.cat.includes(i.value); });
      form.querySelectorAll('[name=brand]').forEach((i) => { i.checked = s.brand.includes(i.value); });
      form.min.value = s.min; form.max.value = s.max;
      form.instock.checked = s.instock; form.weight.checked = s.weight;
      document.getElementById('sort').value = s.sort;
    }
    function formState() {
      const s = readState();
      return { ...s, cat: [...form.querySelectorAll('[name=cat]:checked')].map((i) => i.value), brand: [...form.querySelectorAll('[name=brand]:checked')].map((i) => i.value),
        min: form.min.value.replace(/\D/g, ''), max: form.max.value.replace(/\D/g, ''), instock: form.instock.checked, weight: form.weight.checked,
        sort: document.getElementById('sort').value };
    }

    const sortPrice = (p) => p.pricingMode === 'WEIGHT' ? p.weight.perKgPaisa : p.pricingMode === 'QUOTE_ONLY' ? Infinity : p.pricePaisa;

    function apply(s) {
      let list = s.q ? searchProducts(s.q) : [...PRODUCTS];
      if (s.cat.length) list = list.filter((p) => s.cat.includes(p.category));
      if (s.brand.length) list = list.filter((p) => s.brand.includes(p.brand));
      if (s.instock) list = list.filter(isInStock);
      if (s.weight) list = list.filter((p) => p.pricingMode === 'WEIGHT');
      if (s.min) list = list.filter((p) => sortPrice(p) >= Number(s.min) * 100);
      if (s.max) list = list.filter((p) => sortPrice(p) !== Infinity && sortPrice(p) <= Number(s.max) * 100);
      if (s.sort === 'price-asc') list.sort((a, b) => sortPrice(a) - sortPrice(b));
      if (s.sort === 'price-desc') list.sort((a, b) => (sortPrice(b) === Infinity ? -1 : sortPrice(b)) - (sortPrice(a) === Infinity ? -1 : sortPrice(a)));
      if (s.sort === 'name') list.sort((a, b) => a.name.localeCompare(b.name));
      return list;
    }

    function render(s) {
      const list = apply(s);
      const singleCat = s.cat.length === 1 ? CATEGORIES.find((c) => c.slug === s.cat[0]) : null;
      const title = s.q ? `Results for “${s.q}”` : singleCat ? singleCat.name : 'All products';
      document.getElementById('shop-title').textContent = title;
      document.title = `${title} — Baking House`;
      document.getElementById('crumbs').innerHTML = `<li><a href="index.html">Home</a></li><li><a href="shop.html">Shop</a></li>${singleCat ? `<li aria-current="page">${esc(singleCat.name)}</li>` : ''}`;
      document.getElementById('count').textContent = `${list.length} product${list.length === 1 ? '' : 's'}`;

      const chips = [];
      if (s.q) chips.push(['q', s.q, `Search: ${s.q}`]);
      s.cat.forEach((c) => chips.push(['cat', c, CATEGORIES.find((x) => x.slug === c)?.name]));
      s.brand.forEach((b) => chips.push(['brand', b, b]));
      if (s.instock) chips.push(['instock', '', 'In stock']);
      if (s.weight) chips.push(['weight', '', 'Sold by weight']);
      if (s.min || s.max) chips.push(['price', '', `৳${s.min || 0} – ${s.max ? `৳${s.max}` : 'any'}`]);
      document.getElementById('active').innerHTML = chips.map(([k, v, label]) =>
        `<button class="fchip" data-k="${k}" data-v="${esc(v)}" aria-label="Remove filter ${esc(label)}">${esc(label)} ${icon('x', 'icon')}</button>`).join('');

      document.getElementById('results').classList.toggle('list-view', s.view === 'list');
      document.getElementById('v-grid').setAttribute('aria-pressed', String(s.view === 'grid'));
      document.getElementById('v-list').setAttribute('aria-pressed', String(s.view === 'list'));

      const grid = document.getElementById('grid');
      grid.innerHTML = list.length ? list.map(productCard).join('') : `
        <div class="card empty-state" style="grid-column:1/-1">${icon('search')}
          <h2 style="font-size:var(--bh-fs-lg)">No products match</h2>
          <p class="muted">Try fewer filters, or search for a broader term like “chocolate”, “wok” or “packaging”.</p>
          <div class="row" style="justify-content:center"><button class="btn btn-outline" id="empty-reset">Clear filters</button><a class="btn btn-primary" href="business.html#quotes">Can't find it? Request a quote</a></div>
        </div>`;
    }

    function update(s) { writeState(s); render(s); }

    // Initial: skeleton state, then results (simulates API latency)
    const initial = readState();
    syncForm(initial);
    document.getElementById('grid').innerHTML = Array.from({ length: 8 }, () => '<div class="skeleton sk-card" aria-hidden="true"></div>').join('');
    setTimeout(() => render(initial), 350);

    form.addEventListener('change', () => update(formState()));
    form.min.addEventListener('input', () => update(formState()));
    form.max.addEventListener('input', () => update(formState()));
    document.getElementById('sort').addEventListener('change', () => update(formState()));
    const clearAll = () => { const s = { ...readState(), q: '', cat: [], brand: [], min: '', max: '', instock: false, weight: false }; syncForm(s); update(s); };
    document.getElementById('f-reset').addEventListener('click', clearAll);
    document.addEventListener('click', (e) => { if (e.target.closest('#empty-reset')) clearAll(); });
    document.getElementById('v-grid').addEventListener('click', () => update({ ...formState(), view: 'grid' }));
    document.getElementById('v-list').addEventListener('click', () => update({ ...formState(), view: 'list' }));
    document.getElementById('active').addEventListener('click', (e) => {
      const b = e.target.closest('.fchip'); if (!b) return;
      const s = formState();
      const { k, v } = b.dataset;
      if (k === 'q') { s.q = ''; document.getElementById('q').value = ''; }
      if (k === 'cat') s.cat = s.cat.filter((c) => c !== v);
      if (k === 'brand') s.brand = s.brand.filter((c) => c !== v);
      if (k === 'instock') s.instock = false;
      if (k === 'weight') s.weight = false;
      if (k === 'price') { s.min = ''; s.max = ''; }
      syncForm(s); update(s);
    });

    // Mobile filter drawer
    const filters = document.getElementById('filters'), fo = document.getElementById('f-overlay');
    const toggleF = (open) => { filters.classList.toggle('open', open); fo.classList.toggle('open', open); document.body.classList.toggle('no-scroll', open); if (open) filters.querySelector('input')?.focus(); };
    document.getElementById('filters-open').addEventListener('click', () => toggleF(true));
    document.getElementById('filters-close').addEventListener('click', () => toggleF(false));
    fo.addEventListener('click', () => toggleF(false));
    document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && filters.classList.contains('open')) toggleF(false); });
  </script>
</body>
</html>
