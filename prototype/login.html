<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login / Register — Baking House</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="app-header"></div>
  <main id="main" class="container section">
    <div class="card" style="max-width:460px;margin:0 auto">
      <div class="tabs" role="tablist" aria-label="Account access" style="padding:16px 20px 0">
        <button class="tab" role="tab" id="t-login" aria-controls="p-login" aria-selected="true">Login</button>
        <button class="tab" role="tab" id="t-reg" aria-controls="p-reg" aria-selected="false">Register</button>
      </div>
      <form class="card-pad" id="p-login" role="tabpanel" aria-labelledby="t-login" novalidate>
        <div class="field"><label for="l-id">Mobile number or email</label><input class="input" id="l-id" autocomplete="username" required></div>
        <div class="field"><label for="l-pw">Password</label><input class="input" id="l-pw" type="password" autocomplete="current-password" required></div>
        <div id="l-msg" aria-live="polite"></div>
        <button class="btn btn-primary btn-block" type="submit">Login</button>
        <p class="small" style="margin-top:10px"><a href="#" id="forgot">Forgot password?</a></p>
      </form>
      <form class="card-pad" id="p-reg" role="tabpanel" aria-labelledby="t-reg" hidden novalidate>
        <div class="field"><label for="r-name">Full name</label><input class="input" id="r-name" autocomplete="name" required></div>
        <div class="field"><label for="r-phone">Mobile number</label><input class="input" id="r-phone" inputmode="tel" autocomplete="tel" placeholder="01XXXXXXXXX" required><span class="hint">We'll verify with a one-time code (SMS provider TBD).</span></div>
        <div class="field"><label for="r-pw">Password</label><input class="input" id="r-pw" type="password" autocomplete="new-password" minlength="8" required><span class="hint">At least 8 characters.</span></div>
        <fieldset style="border:0;padding:0;margin:0 0 14px"><legend class="small" style="font-weight:600;color:var(--bh-navy)">Account type</legend>
          <label class="check"><input type="radio" name="type" value="retail" checked> Personal / home baker</label>
          <label class="check"><input type="radio" name="type" value="business"> Restaurant, café or bakery business</label>
          <label class="check"><input type="radio" name="type" value="reseller"> Reseller</label>
          <p class="hint">Business and reseller accounts start as retail until approved.</p></fieldset>
        <div id="r-msg" aria-live="polite"></div>
        <button class="btn btn-primary btn-block" type="submit">Create account</button>
      </form>
    </div>
    <p class="hint" style="text-align:center;margin-top:12px">Prototype: logging in simulates a Retail customer session.</p>
  </main>
  <div id="app-footer"></div>
  <script type="module">
    import { initShell, icon, store } from './assets/js/app.js';
    initShell();
    const tabs = { login: [document.getElementById('t-login'), document.getElementById('p-login')], reg: [document.getElementById('t-reg'), document.getElementById('p-reg')] };
    const pick = (k) => Object.entries(tabs).forEach(([key, [t, p]]) => { t.setAttribute('aria-selected', String(key === k)); p.hidden = key !== k; });
    tabs.login[0].addEventListener('click', () => pick('login'));
    tabs.reg[0].addEventListener('click', () => pick('reg'));
    if (location.hash === '#register') pick('reg');
    const err = (id, text) => { document.getElementById(id).innerHTML = `<div class="alert alert-error" style="margin-bottom:12px">${icon('alert')}<span>${text}</span></div>`; };
    document.getElementById('p-login').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!document.getElementById('l-id').value.trim() || !document.getElementById('l-pw').value) return err('l-msg', 'Enter your mobile/email and password.');
      store.set('bh-role', 'retail'); location.href = 'account.html';
    });
    document.getElementById('p-reg').addEventListener('submit', (e) => {
      e.preventDefault();
      const phone = document.getElementById('r-phone').value.replace(/[\s-]/g, '');
      if (!document.getElementById('r-name').value.trim()) return err('r-msg', 'Enter your name.');
      if (!/^(\+?88)?01[3-9]\d{8}$/.test(phone)) return err('r-msg', 'Enter a valid Bangladesh mobile number.');
      if (document.getElementById('r-pw').value.length < 8) return err('r-msg', 'Password must be at least 8 characters.');
      const type = new FormData(e.target).get('type');
      store.set('bh-role', 'retail');
      location.href = type === 'retail' ? 'account.html' : type === 'business' ? 'business.html#apply' : 'reseller.html';
    });
    document.getElementById('forgot').addEventListener('click', (e) => { e.preventDefault(); document.getElementById('l-msg').innerHTML = `<div class="alert alert-info" style="margin-bottom:12px">${icon('info')}<span>Password reset by SMS/email code arrives in Phase 2.</span></div>`; });
  </script>
</body>
</html>
