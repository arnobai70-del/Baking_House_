<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Admin — Baking House</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="assets/css/tokens.css">
  <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import { icon, esc, getRole, store, ROLES, PRODUCTS, CATEGORIES, formatTaka, formatWeight, toast } from './assets/js/app.js';
    import { quoteWeightLine } from './assets/js/weight-pricing.js';
    import { SAMPLE_ORDERS } from './assets/js/data.js';

    const root = document.getElementById('root');
    if (getRole() !== 'admin') {
      root.innerHTML = `<main class="container"><div class="card denied" style="margin:48px auto;max-width:560px">${icon('lock')}
        <h1 style="font-size:var(--bh-fs-xl)">Admin access required</h1>
        <p class="muted">You're signed in as <strong>${esc(ROLES[getRole()])}</strong>. Admin needs a staff account with MFA (Phase 2).</p>
        <div class="row" style="justify-content:center"><button class="btn btn-navy" id="as-admin">Prototype: view as Admin</button><a class="btn btn-outline" href="index.html">Back to store</a></div></div></main>`;
      document.getElementById('as-admin').addEventListener('click', () => { store.set('bh-role', 'admin'); location.reload(); });
    } else {
      init();
    }

    function init() {
      const NAV = [
        ['Overview', [['dashboard', 'Dashboard', 'chart']]],
        ['Catalog', [['products', 'Products & pricing', 'tag'], ['simulator', 'Price rule simulator', 'settings'], ['media', 'Media approval', 'photo'], ['combos', 'Bundles / combos', 'gift'], ['inventory', 'Inventory', 'box']]],
        ['Sales', [['orders', 'Orders & returns', 'cart'], ['customers', 'Customers', 'user'], ['business', 'Business accounts', 'store'], ['resellers', 'Resellers', 'users'], ['crm', 'CRM leads & quotes', 'quote']]],
        ['Content', [['cms', 'CMS / pages & banners', 'file'], ['seo', 'SEO', 'seo']]],
        ['System', [['reports', 'Reports', 'chart'], ['audit', 'Roles & audit log', 'lock'], ['settings', 'Settings & integrations', 'settings']]],
      ];
      root.innerHTML = `<div class="admin">
        <aside class="admin-side" aria-label="Admin navigation">
          <a class="logo" href="index.html"><span class="logo-mark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21v-6M8.5 12.5a3.5 3.5 0 1 1 3.5-6 3.5 3.5 0 1 1 3.5 6 3.5 3.5 0 1 1-3.5 3 3.5 3.5 0 1 1-3.5-3z"/></svg></span><span class="logo-text"><strong>Baking House</strong><span>Admin · CRM</span></span></a>
          ${NAV.map(([g, items]) => `<h4>${g}</h4>${items.map(([id, label, ic]) => `<a href="#${id}" data-sec="${id}">${icon(ic)} ${label}</a>`).join('')}`).join('')}
        </aside>
        <main class="admin-main" id="main"></main>
      </div>`;
      window.addEventListener('hashchange', show);
      show();
    }

    // In-memory admin state (prototype). Real: DB + audit_logs table.
    const audit = [];
    const priceOverrides = {};
    const effective = (p) => priceOverrides[p.id] ?? (p.pricingMode === 'WEIGHT' ? p.weight.perKgPaisa : p.pricePaisa);

    const SECTIONS = { dashboard, products, simulator, media, audit: auditView };
    function show() {
      const id = location.hash.slice(1) || 'dashboard';
      document.querySelectorAll('[data-sec]').forEach((a) => a.setAttribute('aria-current', String(a.dataset.sec === id)));
      const main = document.getElementById('main');
      const label = document.querySelector(`[data-sec="${id}"]`)?.textContent.trim() ?? 'Dashboard';
      main.innerHTML = `<div class="admin-top"><h1>${esc(label)}</h1><span class="spacer"></span><span class="status warn">Sample data — not real business performance</span><a class="btn btn-outline btn-sm" href="index.html">View store</a></div><div id="sec"></div>`;
      (SECTIONS[id] ?? planned)(document.getElementById('sec'), id);
    }

    function planned(el, id) {
      const phase = { combos: 4, inventory: 4, orders: 5, customers: 7, business: 6, resellers: 6, crm: 7, cms: 3, seo: 3, reports: 7, settings: 2 }[id] ?? '—';
      el.innerHTML = `<div class="card empty-state">${icon('settings')}<h2 style="font-size:var(--bh-fs-lg)">Planned for Phase ${phase}</h2><p class="muted">This module is scoped in docs/roadmap.md and built against the Laravel backend.</p></div>`;
    }

    // ---------------- Dashboard ----------------
    function dashboard(el) {
      // Illustrative daily sales (৳ thousands) — sample only
      const days = ['1 Nov', '5 Nov', '10 Nov', '15 Nov', '20 Nov', '25 Nov', '30 Nov'];
      const vals = [42, 55, 51, 68, 74, 70, 88];
      el.innerHTML = `
        <div class="kpis">
          ${[['Total orders', '3,842', '+14.2% vs prior 30 days'], ['Total sales', '৳1,28,90,000', '+18.6%'], ['Customers', '12,460', '+16.7%'], ['Conversion', '3.8%', '+0.6 pp']]
            .map(([l, v, d]) => `<div class="card kpi"><div class="k-label">${l}</div><div class="k-val tnum">${v}</div><div class="k-delta">${d}</div></div>`).join('')}
        </div>
        <div class="admin-grid">
          <div class="card">
            <div class="panel-title"><h2>Sales overview — last 30 days (৳ thousands, sample)</h2></div>
            <div class="chart" id="chart"></div>
            <details style="padding:0 16px 14px"><summary class="small" style="cursor:pointer">View as table</summary>
              <table class="table" style="margin-top:8px"><thead><tr><th>Date</th><th>Sales (৳k)</th></tr></thead><tbody>${days.map((d, i) => `<tr><td>${d}</td><td class="tnum">${vals[i]}</td></tr>`).join('')}</tbody></table></details>
          </div>
          <div class="card shortcuts"><div class="panel-title"><h2>Management shortcuts</h2></div>
            <a href="#products">${icon('tag')} Set prices & discounts</a><a href="#simulator">${icon('settings')} Simulate a price rule</a><a href="#media">${icon('photo')} Approve product photos</a>
            <a href="#combos">${icon('gift')} Create combo offer</a><a href="#orders">${icon('cart')} Manage orders</a><a href="#crm">${icon('quote')} Leads & follow-up</a><a href="#seo">${icon('seo')} SEO & content</a></div>
        </div>
        <div class="card"><div class="panel-title"><h2>Recent orders (sample)</h2></div><div class="table-wrap"><table class="table"><thead><tr><th>Order</th><th>Date</th><th>Total</th><th>Status</th></tr></thead><tbody>
          ${SAMPLE_ORDERS.map((o) => `<tr><td><strong>${o.ref}</strong></td><td>${o.date}</td><td class="tnum">${formatTaka(o.totalPaisa)}</td><td><span class="status">${o.status}</span></td></tr>`).join('')}</tbody></table></div></div>`;
      lineChart(document.getElementById('chart'), days, vals);
    }

    function lineChart(host, labels, values) {
      const W = 600, H = 240, pl = 36, pr = 12, pt = 12, pb = 28;
      const max = Math.ceil(Math.max(...values) / 20) * 20;
      const x = (i) => pl + (i * (W - pl - pr)) / (values.length - 1);
      const y = (v) => pt + (1 - v / max) * (H - pt - pb);
      const pts = values.map((v, i) => `${x(i)},${y(v)}`).join(' ');
      const ticks = [0, max / 2, max];
      host.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of daily sales, rising from 42 to 88 thousand taka (sample data)">
        ${ticks.map((t) => `<line class="grid-line" x1="${pl}" x2="${W - pr}" y1="${y(t)}" y2="${y(t)}"/><text class="axis-text" x="${pl - 6}" y="${y(t) + 4}" text-anchor="end">${t}</text>`).join('')}
        ${labels.map((l, i) => `<text class="axis-text" x="${x(i)}" y="${H - 8}" text-anchor="middle">${l}</text>`).join('')}
        <polygon class="area" points="${x(0)},${y(0)} ${pts} ${x(values.length - 1)},${y(0)}"/>
        <polyline class="series draw" points="${pts}" style="--len:1200"/>
        <line class="xhair" id="xh" y1="${pt}" y2="${H - pb}" visibility="hidden"/>
        <circle class="dot" id="dot" r="5" visibility="hidden"/>
        <rect x="${pl}" y="0" width="${W - pl - pr}" height="${H}" fill="transparent" id="hit"/>
      </svg><div class="chart-tip" id="tip"></div>`;
      const svg = host.querySelector('svg'), tip = host.querySelector('#tip'), xh = host.querySelector('#xh'), dot = host.querySelector('#dot');
      host.querySelector('#hit').addEventListener('pointermove', (e) => {
        const r = svg.getBoundingClientRect();
        const sx = ((e.clientX - r.left) / r.width) * W;
        const i = Math.max(0, Math.min(values.length - 1, Math.round(((sx - pl) / (W - pl - pr)) * (values.length - 1))));
        xh.setAttribute('x1', x(i)); xh.setAttribute('x2', x(i)); xh.setAttribute('visibility', 'visible');
        dot.setAttribute('cx', x(i)); dot.setAttribute('cy', y(values[i])); dot.setAttribute('visibility', 'visible');
        tip.innerHTML = `<strong>${labels[i]}</strong> · ৳${values[i]}k`;
        tip.style.left = `${16 + (x(i) / W) * r.width}px`;
        tip.style.top = `${12 + (y(values[i]) / H) * r.height}px`;
        tip.classList.add('show');
      });
      host.querySelector('#hit').addEventListener('pointerleave', () => { tip.classList.remove('show'); xh.setAttribute('visibility', 'hidden'); dot.setAttribute('visibility', 'hidden'); });
    }

    // ---------------- Products & pricing ----------------
    function products(el) {
      el.innerHTML = `<div class="card">
        <div class="panel-title"><h2>Products (${PRODUCTS.length})</h2><div class="row"><button class="btn btn-outline btn-sm" disabled title="Phase 7">CSV import</button><button class="btn btn-primary btn-sm" disabled title="Phase 3">${icon('plus')} Add product</button></div></div>
        <div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Category</th><th>Mode</th><th>Price</th><th>Stock</th><th>Photo</th></tr></thead><tbody>
        ${PRODUCTS.map((p) => `<tr>
          <td><strong>${esc(p.name)}</strong><div class="muted small">${p.sku}</div></td>
          <td class="small">${esc(CATEGORIES.find((c) => c.slug === p.category)?.name)}</td>
          <td><span class="status ${p.pricingMode === 'WEIGHT' ? 'info' : ''}">${p.pricingMode}</span></td>
          <td>${p.pricingMode === 'QUOTE_ONLY' ? '<span class="muted small">Quote</span>' : `<label class="sr-only" for="pr-${p.id}">Price for ${esc(p.name)} in taka${p.pricingMode === 'WEIGHT' ? ' per kg' : ''}</label>
            <div class="row" style="flex-wrap:nowrap;gap:6px"><input class="input price-input tnum" id="pr-${p.id}" data-price="${p.id}" value="${effective(p) / 100}" inputmode="decimal"><span class="muted small">${p.pricingMode === 'WEIGHT' ? '/kg' : ''}</span></div>`}</td>
          <td class="tnum small">${p.pricingMode === 'WEIGHT' ? formatWeight(p.weight.stockGrams) : p.stock}${(p.pricingMode === 'WEIGHT' ? p.weight.stockGrams < 1000 : p.stock < 5) ? ' <span class="status warn">Low</span>' : ''}</td>
          <td><span class="status warn">Pending</span></td></tr>`).join('')}
        </tbody></table></div>
        <p class="hint card-pad">Price edits ask for a reason and are written to the audit log. Changes over 20% need super-admin approval (Phase 4).</p>
      </div>`;
      el.addEventListener('change', (e) => {
        const inp = e.target.closest('[data-price]'); if (!inp) return;
        const p = PRODUCTS.find((x) => x.id === Number(inp.dataset.price));
        const m = inp.value.trim().match(/^(\d+)(?:\.(\d{1,2}))?$/);
        if (!m) { inp.setAttribute('aria-invalid', 'true'); toast('Enter a valid price, e.g. 650 or 812.50'); return; }
        inp.removeAttribute('aria-invalid');
        const newPaisa = Number(m[1]) * 100 + Number((m[2] ?? '').padEnd(2, '0') || 0);
        const old = effective(p);
        if (newPaisa === old) return;
        const pct = Math.abs(newPaisa - old) / old;
        const reason = prompt(`Reason for changing ${p.name} from ${formatTaka(old)} to ${formatTaka(newPaisa)}?`);
        if (!reason) { inp.value = old / 100; return; }
        if (pct > 0.2) { toast('Change > 20% — sent for super-admin approval (not applied)'); inp.value = old / 100; audit.unshift({ at: new Date(), who: 'admin (sample)', what: `${p.sku} price change requested ${formatTaka(old)} → ${formatTaka(newPaisa)}`, reason, state: 'Pending approval' }); return; }
        priceOverrides[p.id] = newPaisa;
        audit.unshift({ at: new Date(), who: 'admin (sample)', what: `${p.sku} price ${formatTaka(old)} → ${formatTaka(newPaisa)}`, reason, state: 'Applied' });
        toast('Price updated and logged');
      });
    }

    // ---------------- Price rule simulator ----------------
    function simulator(el) {
      const weightItems = PRODUCTS.filter((p) => p.pricingMode === 'WEIGHT');
      el.innerHTML = `<div class="card card-pad">
        <p class="muted">Preview exactly what a buyer would pay — same engine as checkout. Precedence: contract → role tier → campaign → standard.</p>
        <form class="sim" id="sim">
          <div class="field"><label for="s-p">Product</label><select class="input" id="s-p">${weightItems.map((p) => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
          <div class="field"><label for="s-g">Grams</label><input class="input tnum" id="s-g" value="700" inputmode="numeric"></div>
          <div class="field"><label for="s-r">Buyer role</label><select class="input" id="s-r"><option value="retail">Retail</option><option value="business">Business</option><option value="reseller">Reseller</option></select></div>
          <div class="field"><label for="s-c">Contract ৳/kg (optional)</label><input class="input tnum" id="s-c" inputmode="numeric" placeholder="none"></div>
        </form>
        <div id="sim-out" class="sim-out" aria-live="polite"></div>
      </div>`;
      const run = () => {
        const p = PRODUCTS.find((x) => x.id === Number(el.querySelector('#s-p').value));
        const grams = Number.parseInt(el.querySelector('#s-g').value, 10);
        const c = el.querySelector('#s-c').value.trim();
        const ctx = { role: el.querySelector('#s-r').value, ...(c && /^\d+$/.test(c) ? { contractPerKgPaisa: Number(c) * 100 } : {}) };
        const rule = { ...p.weight, perKgPaisa: effective(p) };
        const q = quoteWeightLine(rule, grams, ctx);
        el.querySelector('#sim-out').innerHTML = q.ok
          ? `<table class="specs"><tbody>
              <tr><th>Quantity</th><td class="tnum">${q.label} (${grams} g)</td></tr>
              <tr><th>Rate applied</th><td class="tnum">${formatTaka(q.perKgPaisa)}/kg</td></tr>
              <tr><th>Rate source</th><td><span class="status info">${q.rateSource}</span></td></tr>
              <tr><th>Line total</th><td class="tnum"><strong style="font-size:var(--bh-fs-lg);color:var(--bh-navy)">${formatTaka(q.linePaisa)}</strong></td></tr></tbody></table>`
          : `<div class="alert alert-error">${icon('alert')}<span>${esc(q.error)}${q.suggestions?.length ? ` Suggested: ${q.suggestions.map((s) => formatWeight(s)).join(' or ')}.` : ''}</span></div>`;
      };
      el.querySelector('#sim').addEventListener('input', run);
      run();
    }

    // ---------------- Media approval (image policy Addendum B) ----------------
    function media(el) {
      const queue = [
        { file: 'dark-compound-front.jpg', sku: 'BH-ING-0001', source: 'Own photography', evidence: 'Shoot brief #01', ok: true },
        { file: 'wok-14in-supplier.jpg', sku: 'BH-RST-0002', source: 'Manufacturer', evidence: 'Missing', ok: false },
        { file: 'hero-kitchen-stock.jpg', sku: '— (banner)', source: 'Licensed stock', evidence: 'Licence PDF', ok: true },
      ];
      el.innerHTML = `<div class="alert alert-info" style="margin-bottom:16px">${icon('info')}<span><strong>Real photography only.</strong> Upload → source → permission evidence → duplicate check → product accuracy → review → approve → publish. Missing evidence blocks publishing.</span></div>
        <div class="card"><div class="table-wrap"><table class="table"><thead><tr><th>File</th><th>SKU</th><th>Source</th><th>Permission evidence</th><th>Action</th></tr></thead><tbody>
        ${queue.map((q, i) => `<tr><td>${placeholder(q.file)}</td><td>${q.sku}</td><td>${q.source}</td><td>${q.ok ? `<span class="status ok">${q.evidence}</span>` : '<span class="status warn">Missing — blocked</span>'}</td>
          <td><button class="btn btn-primary btn-sm" data-approve="${i}" ${q.ok ? '' : 'disabled'}>Approve</button> <button class="btn btn-ghost btn-sm" data-reject="${i}">Reject</button></td></tr>`).join('')}
        </tbody></table></div></div>`;
      function placeholder(name) { return `<span class="small"><strong>${esc(name)}</strong></span>`; }
      el.addEventListener('click', (e) => {
        const a = e.target.closest('[data-approve]'), r = e.target.closest('[data-reject]');
        if (a) { a.closest('tr').querySelector('td:last-child').innerHTML = '<span class="status ok">Approved</span>'; audit.unshift({ at: new Date(), who: 'admin (sample)', what: `Approved image ${queue[a.dataset.approve].file}`, reason: 'Evidence verified', state: 'Applied' }); }
        if (r) { r.closest('tr').querySelector('td:last-child').innerHTML = '<span class="status">Rejected</span>'; }
      });
    }

    function auditView(el) {
      el.innerHTML = `<div class="card">${audit.length ? `<div class="table-wrap"><table class="table"><thead><tr><th>When</th><th>Actor</th><th>Change</th><th>Reason</th><th>State</th></tr></thead><tbody>
        ${audit.map((a) => `<tr><td class="tnum small">${a.at.toLocaleTimeString()}</td><td>${esc(a.who)}</td><td>${esc(a.what)}</td><td>${esc(a.reason)}</td><td><span class="status ${a.state === 'Applied' ? 'ok' : 'warn'}">${a.state}</span></td></tr>`).join('')}
        </tbody></table></div>` : `<div class="empty-state">${icon('lock')}<p><strong>No changes this session</strong></p><p class="muted small">Edit a price in Products & pricing to see an audit entry.</p></div>`}</div>`;
    }
  </script>
</body>
</html>
